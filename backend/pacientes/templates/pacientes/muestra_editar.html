{% extends "core/base.html" %}
{% load static %}

{% block title %}
Editar muestra - {{ paciente.apellido }}, {{ paciente.nombre }}
{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card rinc-card">
                <div class="card-header rinc-card-header">
                    <h4>Editar muestra microbiológica</h4>
                </div>
                <div class="card-body rinc-card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-flex justify-content-between mt-3">
                            <a href="{% url 'pacientes:microbiologia' internacion.pk %}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Guardar cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
